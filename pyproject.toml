[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-research"
version = "0.1.0"
description = "CAGE and the GAPE roadmap: graph analysis of distributed-system communication"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "networkx>=3.2",
  "matplotlib>=3.7",
  "pymetis>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cage = "cage.cli:main"

[tool.setuptools.packages.find]
include = ["cage*", "gape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
